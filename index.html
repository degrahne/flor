<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Lizbeth Guzmán Torres | Te amo</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="message">
            <h1>Para Liz, la más hermosa de todas</h1>
            <p class="te-amo">Te amo 💛</p>
        </div>

        <div class="flower-wrapper">
            <div class="flower" id="flor">
                <div class="petal petal-1"></div>
                <div class="petal petal-2"></div>
                <div class="petal petal-3"></div>
                <div class="petal petal-4"></div>
                <div class="petal petal-5"></div>
                <div class="petal petal-6"></div>
                <div class="petal petal-7"></div>
                <div class="petal petal-8"></div>
                <div class="center"></div>
            </div>

            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
